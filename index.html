<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS ULTIMATE | 3D Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --gold: #c5a059; --bg: #050505; --glass: rgba(255, 255, 255, 0.07); }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: white; min-height: 100vh; overflow-x: hidden; display: flex; align-items: center; justify-content: center; }

        /* 3D DOORS & FULL SCREEN LOGIN */
        .door { position: fixed; top: 0; width: 50%; height: 100%; background: #111; z-index: 1000; transition: 1.5s cubic-bezier(0.7, 0, 0.3, 1); border: 1px solid #222; }
        .left-door { left: 0; border-right: 3px solid var(--gold); }
        .right-door { right: 0; border-left: 3px solid var(--gold); }
        .open .left-door { transform: translateX(-100%); opacity: 0; }
        .open .right-door { transform: translateX(100%); opacity: 0; }

        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 1010; transition: 0.8s; background: var(--bg); }
        .open .auth-overlay { opacity: 0; visibility: hidden; }
        .auth-card { background: rgba(15,15,15,0.95); padding: 40px; border-radius: 20px; border: 1px solid var(--gold); text-align: center; width: 90%; max-width: 380px; backdrop-filter: blur(20px); box-shadow: 0 0 50px rgba(0,0,0,1); }

        /* 3D WELCOME GREETING */
        #welcome-layer { position: fixed; top:0; left:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; background: #000; z-index: 900; }
        .greet-3d { font-family: 'Orbitron'; font-size: 8vw; color: var(--gold); text-shadow: 0 0 30px var(--gold); transform: perspective(500px) translateZ(0); opacity: 0; transition: 1.5s; }

        /* HAMBURGER & SIDEBAR */
        .menu-trigger { position: fixed; top: 25px; left: 25px; z-index: 850; cursor: pointer; display: none; background: var(--glass); padding: 10px; border-radius: 10px; border: 1px solid var(--gold); }
        .open .menu-trigger { display: block; }
        .sidebar { position: fixed; left: -300px; top: 0; width: 280px; height: 100%; background: rgba(10,10,10,0.98); z-index: 800; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); padding: 100px 30px; border-right: 2px solid var(--gold); backdrop-filter: blur(20px); }
        .sidebar.active { left: 0; box-shadow: 20px 0 50px rgba(0,0,0,0.8); }

        /* 3D DASHBOARD */
        .main-container { display: none; width: 100%; max-width: 1000px; padding: 100px 20px; box-sizing: border-box; }
        .open .main-container { display: block; }
        .glass-panel { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 25px; padding: 40px; backdrop-filter: blur(15px); box-shadow: 0 20px 60px rgba(0,0,0,0.5); transform-style: preserve-3d; }
        
        input, textarea { width: 100%; padding: 15px; margin: 10px 0; background: rgba(0,0,0,0.8); border: 1px solid #444; color: white !important; border-radius: 12px; font-family: 'Poppins'; box-sizing: border-box; }
        input:focus { border-color: var(--gold); box-shadow: 0 0 15px var(--gold); outline: none; }
        .action-btn { background: var(--gold); color: black; border: none; padding: 18px; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 20px; transition: 0.4s; }

        /* THE PDF PAGES (Render Hidden) */
        #render-vault { position: absolute; left: -9999px; top: -9999px; }
        .pdf-page { background: white; color: #333; width: 210mm; min-height: 296.5mm; padding: 20mm; box-sizing: border-box; font-family: 'Poppins', sans-serif; display: block; }
        .p-header { border-bottom: 6px solid var(--gold); padding-bottom: 30px; display: flex; align-items: center; gap: 40px; }
        .p-img-circle { width: 180px; height: 180px; border-radius: 50%; border: 5px solid var(--gold); object-fit: cover; }
        h2 { border-left: 8px solid var(--gold); padding-left: 20px; text-transform: uppercase; font-size: 24px; margin-top: 40px; color: #000; }
        .p-text { font-size: 16px; line-height: 1.8; white-space: pre-line; color: #444; }
        .page-tag { position: absolute; bottom: 15mm; right: 20mm; color: #bbb; font-weight: 900; }
    </style>
</head>
<body id="master-body">

    <div class="menu-trigger" onclick="toggleSidebar()">
        <div style="width:30px; height:3px; background:var(--gold); margin:6px 0;"></div>
        <div style="width:30px; height:3px; background:var(--gold); margin:6px 0;"></div>
        <div style="width:30px; height:3px; background:var(--gold); margin:6px 0;"></div>
    </div>

    <div class="sidebar" id="sidebar-nav">
        <h2 style="color:var(--gold); font-family:'Orbitron';">SELECT TYPE</h2>
        <button class="action-btn" onclick="setMode('Classic')">Classic Elite</button>
        <button class="action-btn" onclick="setMode('Modern')" style="background:#fff; margin-top:15px;">Modern Minimal</button>
        <button class="action-btn" onclick="setMode('Cyber')" style="background:#00ff00; margin-top:15px;">Cyber Matrix</button>
    </div>

    <div class="door left-door"></div>
    <div class="door right-door"></div>

    <div class="auth-overlay">
        <div class="auth-card">
            <h1 style="color:var(--gold); font-family:'Orbitron'; font-size:24px; margin-bottom:20px;">SECURITY AUTH</h1>
            <input type="text" id="login-user" placeholder="ENTER YOUR NAME">
            <div id="captcha-box" style="background:#000; color:var(--gold); padding:15px; margin:15px 0; letter-spacing:10px; font-weight:900; border:1px dashed var(--gold); font-size:24px;"></div>
            <input type="text" id="captcha-input" placeholder="ENTER CAPTCHA">
            <button class="action-btn" onclick="verifyLogin()">UNLOCK ACCESS ⚡</button>
        </div>
    </div>

    <div id="welcome-layer">
        <h1 class="greet-3d" id="greet-msg"></h1>
    </div>

    <div class="main-container">
        <div class="glass-panel">
            <h2 id="current-type" style="color:var(--gold); margin:0; font-family:'Orbitron'; border:none; padding:0;">TYPE: CLASSIC (2-PAGE)</h2>
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:20px; margin-top:30px;">
                <input type="text" id="fn" placeholder="Full Name">
                <input type="text" id="fr" placeholder="Current Role">
                <input type="text" id="fph" placeholder="Phone Number">
                <input type="email" id="fem" placeholder="Email Address">
                <input type="text" id="fli" placeholder="LinkedIn URL">
                <input type="file" id="fimg" onchange="processImage(event)">
            </div>
            <textarea id="f-about" rows="4" placeholder="Summary / About Me (Page 1)"></textarea>
            <textarea id="f-projects" rows="6" placeholder="Main Projects (Page 1)"></textarea>
            <textarea id="f-extra" rows="5" placeholder="Page 2: Certifications, Skills & Extra Info"></textarea>
            <button class="action-btn" onclick="generateAndReady()">BUILD & PREVIEW ✨</button>
        </div>
        
        <div id="preview-status" style="display:none; text-align:center; margin-top:30px;">
            <p style="color:var(--gold); font-weight:bold;">PDF READY FOR SECURE DOWNLOAD</p>
            <button class="action-btn" onclick="finalDownload()" style="background:#2ecc71; max-width:300px;">SAVE 100% CONTENT PDF 📄</button>
        </div>
    </div>

    <div id="render-vault">
        <div id="pdf-to-capture">
            <div class="pdf-page" id="p1">
                <div class="p-header">
                    <img id="res-img" class="p-img-circle" src="">
                    <div>
                        <h1 id="res-name" style="margin:0; font-size:45px; text-transform:uppercase;"></h1>
                        <p id="res-role" style="color:var(--gold); font-weight:800; font-size:22px;"></p>
                        <p id="res-contacts" style="font-size:15px; color:#666;"></p>
                    </div>
                </div>
                <h2>Professional Summary</h2>
                <p id="res-about" class="p-text"></p>
                <h2>Featured Projects</h2>
                <p id="res-projects" class="p-text"></p>
                <div class="page-tag">PAGE 01</div>
            </div>
            <div class="pdf-page" id="p2" style="margin-top:20px;">
                <h2>Certifications & Skills</h2>
                <p id="res-extra" class="p-text"></p>
                <div class="page-tag">PAGE 02</div>
            </div>
        </div>
    </div>

    <script>
        let capCode = Math.random().toString(36).substring(2, 7).toUpperCase();
        document.getElementById('captcha-box').innerText = capCode;
        let currentMode = 'Classic';

        function toggleSidebar() { document.getElementById('sidebar-nav').classList.toggle('active'); }
        function setMode(m) { currentMode = m; document.getElementById('current-type').innerText = "TYPE: " + m.toUpperCase(); toggleSidebar(); }

        function verifyLogin() {
            const user = document.getElementById('login-user').value;
            const input = document.getElementById('captcha-input').value.toUpperCase();
            if(user && input === capCode) {
                document.getElementById('master-body').classList.add('open');
                const welcome = document.getElementById('welcome-layer');
                const msg = document.getElementById('greet-msg');
                welcome.style.display = 'flex';
                msg.innerText = "WELCOME AGENT " + user.toUpperCase();
                setTimeout(() => { msg.style.opacity = 1; msg.style.transform = "translateZ(100px)"; }, 100);
                setTimeout(() => { welcome.style.opacity = 0; setTimeout(() => welcome.style.display='none', 800); }, 3000);
            } else { alert("ACCESS DENIED: Verify Captcha"); }
        }

        let imageData = "";
        function processImage(e) {
            const reader = new FileReader();
            reader.onload = () => imageData = reader.result;
            reader.readAsDataURL(e.target.files[0]);
        }

        function generateAndReady() {
            document.getElementById('res-name').innerText = document.getElementById('fn').value;
            document.getElementById('res-role').innerText = document.getElementById('fr').value;
            document.getElementById('res-contacts').innerText = `PH: ${document.getElementById('fph').value} | EM: ${document.getElementById('fem').value} | LI: ${document.getElementById('fli').value}`;
            document.getElementById('res-about').innerText = document.getElementById('f-about').value;
            document.getElementById('res-projects').innerText = document.getElementById('f-projects').value;
            document.getElementById('res-extra').innerText = document.getElementById('f-extra').value;
            if(imageData) document.getElementById('res-img').src = imageData;
            
            document.getElementById('preview-status').style.display = 'block';
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        async function finalDownload() {
            const element = document.getElementById('pdf-to-capture');
            const opt = {
                margin: 0,
                filename: 'Nexus_Elite_Portfolio.pdf',
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { scale: 3, useCORS: true, logging: false, letterRendering: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            // Critical fix for empty PDF: Wait for content to sync
            await html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
