<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS PRO | Fixed Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --accent: #00d2ff; --bg-dash: #0f172a; --gold: #c5a059; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #050505; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; perspective: 2000px; overflow-x: hidden; }

        /* DOORS */
        .door { position: fixed; top: 0; width: 50%; height: 100%; background: #111; z-index: 1000; transition: 1.2s; border: 1px solid #222; }
        .left-door { left: 0; border-right: 3px solid var(--accent); }
        .right-door { right: 0; border-left: 3px solid var(--accent); }
        .open .left-door { transform: rotateY(-90deg) translateX(-100%); opacity: 0; }
        .open .right-door { transform: rotateY(90deg) translateX(100%); opacity: 0; }

        /* AUTH CARD - FIXED CAPTCHA BOX */
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 1010; background: #000; transition: 0.8s; }
        .open .auth-overlay { opacity: 0; visibility: hidden; }
        .auth-card { background: rgba(15,15,15,0.95); padding: 30px; border-radius: 20px; border: 2px solid var(--accent); text-align: center; width: 90%; max-width: 350px; }
        #cap-box { background: #000; color: var(--accent); padding: 12px; margin: 15px 0; letter-spacing: 8px; font-weight: 900; border: 1px dashed var(--accent); font-size: 22px; font-family: 'Orbitron'; }

        /* DASHBOARD - NO WASTE SPACE */
        .main-container { display: none; width: 100%; max-width: 1000px; padding: 20px; box-sizing: border-box; transition: 0.1s; }
        .open .main-container { display: block; }
        .glass-panel { background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%); border: 1px solid rgba(0, 210, 255, 0.3); border-radius: 20px; padding: 25px; backdrop-filter: blur(20px); transform-style: preserve-3d; }
        
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: rgba(0,0,0,0.5) !important; border: 1px solid #334155; color: #38bdf8 !important; border-radius: 10px; box-sizing: border-box; }
        .action-btn { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: 800; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 15px; }

        /* PDF FIX: CONTENT STARTS FROM TOP */
        #render-vault { position: absolute; left: -9999px; top: -9999px; }
        .pdf-page { background: white; color: #333; width: 210mm; min-height: 297mm; padding: 10mm 15mm; box-sizing: border-box; position: relative; }
        .p-header { border-bottom: 5px solid #0f172a; padding-bottom: 10px; display: flex; align-items: center; gap: 20px; margin-top: 0; }
        .p-img { width: 130px; height: 130px; border-radius: 50%; border: 4px solid #0f172a; object-fit: cover; }
        .p-body h2 { border-left: 6px solid #38bdf8; padding-left: 15px; text-transform: uppercase; font-size: 18px; margin-top: 15px; color: #000; }
        .p-text { font-size: 14px; line-height: 1.5; white-space: pre-line; color: #444; margin: 5px 0; }
    </style>
</head>
<body id="master-body" onmousemove="handle3D(event)">

    <div class="door left-door"></div>
    <div class="door right-door"></div>

    <div class="auth-overlay">
        <div class="auth-card">
            <h2 style="color:var(--accent); font-family:'Orbitron';">SECURITY AUTH</h2>
            <input type="text" id="login-user" placeholder="NAME">
            <div id="cap-box"></div> <input type="text" id="cap-in" placeholder="TYPE CAPTCHA">
            <button class="action-btn" onclick="verifyLogin()">UNLOCK ACCESS ⚡</button>
        </div>
    </div>

    <div class="main-container" id="dash">
        <div class="glass-panel">
            <h2 style="color:var(--accent); font-family:'Orbitron'; margin:0;">DYNAMIC PORTFOLIO BUILDER</h2>
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:10px; margin-top:15px;">
                <input type="text" id="fn" placeholder="Full Name">
                <input type="text" id="fr" placeholder="Role">
                <input type="text" id="fph" placeholder="Phone">
                <input type="email" id="fem" placeholder="Email">
                <input type="file" id="fimg" onchange="processImage(event)">
            </div>
            <textarea id="fab" rows="3" placeholder="Summary"></textarea>
            <textarea id="fpj" rows="5" placeholder="Work & Projects (Smart Overflow to P2)"></textarea>
            <button class="action-btn" onclick="generateAndReady()">BUILD NO-WASTE PDF ✨</button>
        </div>
        
        <div id="preview-status" style="display:none; text-align:center; margin-top:20px;">
            <button class="action-btn" onclick="finalDownload()" style="background:#2ecc71; max-width:300px;">SAVE FINAL PDF 📄</button>
        </div>
    </div>

    <div id="render-vault">
        <div id="pdf-capture">
            <div class="pdf-page" id="p1">
                <div class="p-header">
                    <img id="res-img" class="p-img" src="">
                    <div><h1 id="res-name" style="margin:0; font-size:32px; color:#000;"></h1><p id="res-role" style="color:#38bdf8; font-weight:800; font-size:18px;"></p></div>
                </div>
                <div class="p-body">
                    <h2>Professional Profile</h2><p id="res-about" class="p-text"></p>
                    <h2>Key Projects</h2><p id="res-projects" class="p-text"></p>
                </div>
            </div>
            <div class="pdf-page" id="p2" style="display:none;">
                <div class="p-body" id="p2-content"></div>
            </div>
        </div>
    </div>

    <script>
        // CAPTCHA GENERATION
        let capCode = Math.random().toString(36).substring(2, 7).toUpperCase();
        document.getElementById('cap-box').innerText = capCode;

        function handle3D(e) {
            if(!document.getElementById('master-body').classList.contains('open')) return;
            const dash = document.getElementById('dash');
            const x = (window.innerWidth / 2 - e.pageX) / 45;
            const y = (window.innerHeight / 2 - e.pageY) / 45;
            dash.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        }

        function verifyLogin() {
            const user = document.getElementById('login-user').value;
            const input = document.getElementById('cap-in').value.toUpperCase();
            if(user && input === capCode) {
                document.getElementById('master-body').classList.add('open');
                document.body.style.background = "var(--bg-dash)";
            } else { alert("ACCESS DENIED: Captcha Dobbindi/Incorrect"); }
        }

        let imageData = "";
        function processImage(e) {
            const reader = new FileReader();
            reader.onload = () => imageData = reader.result;
            reader.readAsDataURL(e.target.files[0]);
        }

        function generateAndReady() {
            document.getElementById('res-name').innerText = document.getElementById('fn').value.toUpperCase();
            document.getElementById('res-role').innerText = document.getElementById('fr').value;
            document.getElementById('res-about').innerText = document.getElementById('fab').value;
            
            const projects = document.getElementById('fpj').value;
            if(projects.length > 950) {
                document.getElementById('res-projects').innerText = projects.substring(0, 950) + "... (Contd. on P2)";
                document.getElementById('p2').style.display = 'block';
                document.getElementById('p2-content').innerHTML = `<h2>Continued Projects</h2><p class="p-text">${projects.substring(950)}</p>`;
            } else {
                document.getElementById('res-projects').innerText = projects;
                document.getElementById('p2').style.display = 'none';
            }

            if(imageData) document.getElementById('res-img').src = imageData;
            document.getElementById('preview-status').style.display = 'block';
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function finalDownload() {
            const element = document.getElementById('pdf-capture');
            html2pdf().set({ margin: 0, filename: 'Nexus_Final.pdf', html2canvas: { scale: 3, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).from(element).save();
        }
    </script>
</body>
</html>
