<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS 3D | Ultimate Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --gold: #c5a059; --bg: #030303; --glass: rgba(255, 255, 255, 0.05); }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: white; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* 3D DOORS */
        .door { position: fixed; top: 0; width: 50%; height: 100%; background: #111; z-index: 500; transition: 1.5s cubic-bezier(0.7, 0, 0.3, 1); border: 1px solid #222; }
        .left-door { left: 0; border-right: 3px solid var(--gold); }
        .right-door { right: 0; border-left: 3px solid var(--gold); }
        .open .left-door { transform: rotateY(-90deg) translateX(-100%); opacity: 0; }
        .open .right-door { transform: rotateY(90deg) translateX(100%); opacity: 0; }

        /* CENTERED 3D LOGIN CARD */
        .auth-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 510; transition: 0.5s; }
        .open .auth-container { visibility: hidden; opacity: 0; }
        .auth-card { background: rgba(15,15,15,0.9); padding: 35px; border-radius: 20px; border: 1px solid var(--gold); text-align: center; width: 90%; max-width: 350px; backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0,0,0,1); transform: translateZ(50px); }

        /* UI ELEMENTS */
        .menu-btn { position: fixed; top: 20px; left: 20px; z-index: 600; cursor: pointer; display: none; }
        .open .menu-btn { display: block; }
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: rgba(5,5,5,0.95); z-index: 550; transition: 0.5s; padding: 100px 20px; border-right: 2px solid var(--gold); backdrop-filter: blur(20px); }
        .sidebar.active { left: 0; }

        /* 3D DASHBOARD CONTENT */
        .container { display: none; width: 100%; padding: 80px 15px; box-sizing: border-box; }
        .open .container { display: block; }
        .glass-card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 30px; backdrop-filter: blur(10px); box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; background: rgba(0,0,0,0.6); border: 1px solid #333; color: white; border-radius: 10px; box-sizing: border-box; }
        .btn { background: var(--gold); color: black; border: none; padding: 15px; border-radius: 10px; font-weight: 800; cursor: pointer; width: 100%; text-transform: uppercase; transition: 0.3s; }
        .btn:hover { transform: scale(1.02); box-shadow: 0 0 20px var(--gold); }

        /* PDF TEMPLATE (Strictly 2 Pages) */
        #pdf-render { background: #222; padding: 20px 0; display: none; flex-direction: column; align-items: center; gap: 30px; }
        .page { background: white; color: #333; width: 210mm; min-height: 296mm; padding: 20mm; box-sizing: border-box; position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        
        .p-header { border-bottom: 5px solid var(--gold); padding-bottom: 20px; display: flex; align-items: center; gap: 30px; }
        .p-img { width: 170px; height: 170px; border-radius: 50%; border: 4px solid var(--gold); object-fit: cover; }
        h2 { border-left: 6px solid var(--gold); padding-left: 15px; text-transform: uppercase; color: #000; font-size: 20px; margin-top: 30px; }
        .p-content { font-size: 15px; line-height: 1.7; white-space: pre-line; color: #444; }
        .page-footer { position: absolute; bottom: 15mm; right: 20mm; color: #aaa; font-weight: bold; }

        @media (max-width: 768px) {
            .page { width: 100%; min-height: auto; padding: 10mm; }
            .p-header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body id="master">

    <div class="menu-btn" onclick="toggleSidebar()">
        <div style="width:30px; height:3px; background:var(--gold); margin:6px 0;"></div>
        <div style="width:30px; height:3px; background:var(--gold); margin:6px 0;"></div>
        <div style="width:30px; height:3px; background:var(--gold); margin:6px 0;"></div>
    </div>

    <div class="sidebar" id="sidebar">
        <h3 style="color:var(--gold); font-family:'Orbitron';">NEXUS THEMES</h3>
        <button class="btn" onclick="setTheme('classic')">Classic Gold</button>
        <button class="btn" onclick="setTheme('modern')" style="background:#fff; margin-top:10px;">Modern White</button>
    </div>

    <div class="door left-door"></div>
    <div class="door right-door"></div>

    <div class="auth-container">
        <div class="auth-card">
            <h2 style="color:var(--gold); font-family:'Orbitron'; letter-spacing:2px;">SECURITY CHECK</h2>
            <input type="text" id="username" placeholder="NAME (USER ID)">
            <div id="cap-box" style="background:#000; color:var(--gold); padding:10px; margin:10px 0; letter-spacing:8px; font-weight:900; border:1px dashed var(--gold);"></div>
            <input type="text" id="cap-in" placeholder="TYPE CAPTCHA">
            <button class="btn" onclick="verify()">INITIALIZE NEXUS ⚡</button>
        </div>
    </div>

    <div class="container">
        <div class="glass-card">
            <h2 style="color:var(--gold); font-family:'Orbitron';">GENERATE ELITE 2-PAGE</h2>
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:15px; margin-top:10px;">
                <input type="text" id="fn" placeholder="Full Name">
                <input type="text" id="fr" placeholder="Role (e.g. Developer)">
                <input type="text" id="fph" placeholder="Phone Number">
                <input type="email" id="fem" placeholder="Email Address">
                <input type="text" id="fli" placeholder="LinkedIn URL">
                <input type="file" id="fimg" onchange="loadImg(event)">
            </div>
            <textarea id="fab" rows="3" placeholder="Professional Summary (Page 1)"></textarea>
            <textarea id="fpj" rows="5" placeholder="Featured Projects (Page 1)"></textarea>
            <textarea id="fex" rows="4" placeholder="Certifications & Extra Details (Page 2)"></textarea>
            <button class="btn" onclick="build()">GENERATE PORTFOLIO ✨</button>
        </div>

        <div id="pdf-render">
            <div id="pdf-capture" style="background: #222; display: flex; flex-direction: column; gap: 20px;">
                <div class="page" id="page1">
                    <div class="p-header">
                        <img id="res-img" class="p-img" src="">
                        <div style="flex:1;">
                            <h1 id="res-name" style="margin:0; font-size:38px; color:#000;"></h1>
                            <p id="res-role" style="color:var(--gold); font-weight:bold; font-size:18px;"></p>
                            <p id="res-contacts" style="font-size:13px; color:#666;"></p>
                        </div>
                    </div>
                    <h2>About Me</h2>
                    <p id="res-ab" class="p-content"></p>
                    <h2>Main Projects</h2>
                    <p id="res-pj" class="p-content"></p>
                    <div class="page-footer">Page 01</div>
                </div>
                <div class="page" id="page2">
                    <h2>Certifications & Extra Info</h2>
                    <p id="res-ex" class="p-content"></p>
                    <div style="margin-top:40px;">
                        <h2>Technical Skills</h2>
                        <p class="p-content">Python, Java, JavaScript, Web Technologies (HTML, CSS), SQL, Git.</p>
                    </div>
                    <div class="page-footer">Page 02</div>
                </div>
            </div>
            <button class="btn" onclick="download()" style="background:#2ecc71; margin-top:30px; max-width:400px;">DOWNLOAD PROFESSIONAL PDF 📄</button>
        </div>
    </div>

    <script>
        // Captcha Setup
        let code = Math.random().toString(36).substring(2, 7).toUpperCase();
        document.getElementById('cap-box').innerText = code;

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function setTheme(t) { /* Add theme logic here if needed */ toggleSidebar(); }

        function verify() {
            const u = document.getElementById('username').value;
            const c = document.getElementById('cap-in').value.toUpperCase();
            if(u && c === code) {
                document.getElementById('master').classList.add('open');
            } else { alert("Failed! Check name and captcha."); }
        }

        let iData = "";
        function loadImg(e) {
            const r = new FileReader();
            r.onload = () => iData = r.result;
            r.readAsDataURL(e.target.files[0]);
        }

        function build() {
            document.getElementById('res-name').innerText = document.getElementById('fn').value.toUpperCase();
            document.getElementById('res-role').innerText = document.getElementById('fr').value;
            document.getElementById('res-contacts').innerText = `📞 ${document.getElementById('fph').value} | 📧 ${document.getElementById('fem').value} | 🔗 ${document.getElementById('fli').value}`;
            document.getElementById('res-ab').innerText = document.getElementById('fab').value;
            document.getElementById('res-pj').innerText = document.getElementById('fpj').value;
            document.getElementById('res-ex').innerText = document.getElementById('fex').value;
            if(iData) document.getElementById('res-img').src = iData;

            document.getElementById('pdf-render').style.display = 'flex';
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function download() {
            const element = document.getElementById('pdf-capture');
            const opt = { 
                margin: 0, 
                filename: 'Elite_Portfolio.pdf', 
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, logging: false, letterRendering: true }, 
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } 
            };
            // The Fix: Use Promise to ensure rendering is complete
            html2pdf().set(opt).from(element).toPdf().get('pdf').save();
        }
    </script>
</body>
</html>
