        <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Multi-Portfolio Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --gold: #c5a059; --bg: #0a0a0a; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: white; overflow-x: hidden; }

        /* SIDEBAR STYLES */
        .sidebar { position: fixed; left: -280px; top: 0; width: 250px; height: 100%; background: #111; z-index: 300; transition: 0.4s; padding: 20px; border-right: 1px solid var(--gold); }
        .sidebar.active { left: 0; }
        .menu-btn { position: fixed; top: 20px; left: 20px; z-index: 310; cursor: pointer; display: none; }
        .open .menu-btn { display: block; }
        .menu-btn div { width: 30px; height: 3px; background: var(--gold); margin: 6px 0; transition: 0.4s; }

        /* DOORS & AUTH */
        .door { position: fixed; top: 0; width: 50%; height: 100%; background: #151515; z-index: 200; transition: 1.5s ease-in-out; border: 1px solid #222; }
        .left-door { left: 0; border-right: 4px solid var(--gold); }
        .right-door { right: 0; border-left: 4px solid var(--gold); }
        .open .left-door { transform: translateX(-100%); z-index: -1; }
        .open .right-door { transform: translateX(100%); z-index: -1; }
        
        .auth-card { position: fixed; z-index: 210; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111; padding: 30px; border-radius: 20px; border: 1px solid var(--gold); text-align: center; width: 280px; }
        .open .auth-card { opacity: 0; visibility: hidden; }

        /* CONTENT */
        .container { display: none; padding: 80px 20px; max-width: 900px; margin: 0 auto; }
        .open .container { display: block; }
        
        /* TEMPLATE STYLES */
        .page { background: white; color: #333; width: 210mm; min-height: 297mm; padding: 20mm; margin: 20px auto; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        /* THEME 2: Modern Creative */
        .modern-theme { border-top: 20px solid #2c3e50; }
        /* THEME 3: Cyber Dark */
        .cyber-theme { background: #000; color: #00ff00; font-family: 'Orbitron', sans-serif; border: 2px solid #00ff00; }

        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; color: white; border-radius: 5px; }
        .btn { background: var(--gold); color: #000; border: none; padding: 15px; border-radius: 5px; font-weight: 800; cursor: pointer; width: 100%; }
    </style>
</head>
<body id="master">

    <div class="menu-btn" onclick="toggleSidebar()">
        <div></div><div></div><div></div>
    </div>
    <div class="sidebar" id="sidebar">
        <h3 style="color:var(--gold)">SELECT DESIGN</h3>
        <button class="btn" onclick="setTemplate('classic')" style="margin-bottom:10px;">Classic Professional</button>
        <button class="btn" onclick="setTemplate('modern')" style="margin-bottom:10px;">Modern Creative</button>
        <button class="btn" onclick="setTemplate('cyber')">Cyber Dark</button>
    </div>

    <div class="door left-door"></div>
    <div class="door right-door"></div>

    <div class="auth-card">
        <h2 style="color:var(--gold)">AUTHENTICATION</h2>
        <input type="text" id="uname" placeholder="USERNAME">
        <button class="btn" onclick="unlock()">LOGIN</button>
    </div>

    <div class="container">
        <div id="setup-form" style="background:#1a1a1a; padding:30px; border-radius:15px; border:1px solid #333;">
            <h2 id="current-temp-text" style="color:var(--gold)">CURRENT: CLASSIC</h2>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <input type="text" id="fn" placeholder="Full Name">
                <input type="text" id="fr" placeholder="Role">
                <input type="file" id="fi" onchange="prev(event)">
            </div>
            <textarea id="fab" rows="3" placeholder="Summary"></textarea>
            <textarea id="fpj" rows="5" placeholder="Projects"></textarea>
            <button class="btn" onclick="generate()">GENERATE SELECTED PORTFOLIO ✨</button>
        </div>

        <div id="res-ui" style="display:none; margin-top:50px;">
            <div id="pdf-area">
                <div id="main-page" class="page">
                    <div id="header-section" style="display:flex; align-items:center; gap:20px; border-bottom:2px solid #eee; padding-bottom:20px;">
                        <img id="res-img" style="width:150px; height:150px; border-radius:50%; object-fit:cover;">
                        <div>
                            <h1 id="res-name" style="margin:0;"></h1>
                            <p id="res-role" style="font-weight:bold;"></p>
                        </div>
                    </div>
                    <h2>ABOUT</h2>
                    <p id="res-ab" style="line-height:1.6;"></p>
                    <h2>PROJECTS</h2>
                    <p id="res-pj" style="white-space:pre-line; line-height:1.6;"></p>
                </div>
            </div>
            <button class="btn" onclick="savePdf()" style="background:#2ecc71; margin-bottom:50px;">DOWNLOAD PDF 📄</button>
        </div>
    </div>

    <script>
        let selectedTheme = 'classic';
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function unlock() { document.getElementById('master').classList.add('open'); }
        
        function setTemplate(type) {
            selectedTheme = type;
            document.getElementById('current-temp-text').innerText = "CURRENT: " + type.toUpperCase();
            toggleSidebar();
        }

        let iData = "";
        function prev(e) {
            const r = new FileReader();
            r.onload = () => iData = r.result;
            r.readAsDataURL(e.target.files[0]);
        }

        function generate() {
            const page = document.getElementById('main-page');
            page.className = "page " + selectedTheme + "-theme"; // Apply selected theme class
            
            document.getElementById('res-name').innerText = document.getElementById('fn').value;
            document.getElementById('res-role').innerText = document.getElementById('fr').value;
            document.getElementById('res-ab').innerText = document.getElementById('fab').value;
            document.getElementById('res-pj').innerText = document.getElementById('fpj').value;
            if(iData) document.getElementById('res-img').src = iData;
            
            document.getElementById('res-ui').style.display = 'block';
        }

        function savePdf() {
            const e = document.getElementById('pdf-area');
            html2pdf().from(e).save('My_Portfolio.pdf');
        }
    </script>
</body>
</html>
