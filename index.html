<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS ULTIMATE | 3D Portfolio Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --gold: #c5a059; --bg: #050505; --glass: rgba(255, 255, 255, 0.08); }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: white; min-height: 100vh; overflow-x: hidden; display: flex; align-items: center; justify-content: center; }

        /* FULL SCREEN 3D DOORS */
        .door { position: fixed; top: 0; width: 50%; height: 100%; background: #111; z-index: 1000; transition: 1.5s cubic-bezier(0.7, 0, 0.3, 1); border: 1px solid #222; }
        .left-door { left: 0; border-right: 3px solid var(--gold); }
        .right-door { right: 0; border-left: 3px solid var(--gold); }
        .open .left-door { transform: translateX(-100%); opacity: 0; }
        .open .right-door { transform: translateX(100%); opacity: 0; }

        /* AUTH OVERLAY */
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 1010; background: var(--bg); transition: 0.8s; }
        .open .auth-overlay { opacity: 0; visibility: hidden; }
        .auth-card { background: rgba(15,15,15,0.95); padding: 40px; border-radius: 25px; border: 1px solid var(--gold); text-align: center; width: 90%; max-width: 380px; backdrop-filter: blur(20px); box-shadow: 0 0 60px rgba(0,0,0,1); transform: perspective(1000px) rotateX(5deg); }

        /* 3D WELCOME GREETING */
        #welcome-layer { position: fixed; top:0; left:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; background: radial-gradient(circle, #111, #000); z-index: 950; }
        .greet-3d { font-family: 'Orbitron'; font-size: 6vw; color: var(--gold); text-shadow: 0 0 30px var(--gold); opacity: 0; transform: translateZ(100px); transition: 1.2s ease-out; }

        /* HAMBURGER & SIDEBAR */
        .menu-trigger { position: fixed; top: 25px; left: 25px; z-index: 850; cursor: pointer; display: none; background: var(--glass); padding: 12px; border-radius: 12px; border: 1px solid var(--gold); transition: 0.3s; }
        .open .menu-trigger { display: block; }
        .sidebar { position: fixed; left: -320px; top: 0; width: 280px; height: 100%; background: rgba(8,8,8,0.98); z-index: 800; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); padding: 120px 30px; border-right: 2px solid var(--gold); backdrop-filter: blur(20px); transform: rotateY(-20deg); transform-origin: left; }
        .sidebar.active { left: 0; transform: rotateY(0deg); }

        /* FLOATING 3D DASHBOARD */
        .main-container { display: none; width: 100%; max-width: 1000px; padding: 60px 20px; box-sizing: border-box; }
        .open .main-container { display: block; animation: floatIn 1.2s ease; }
        @keyframes floatIn { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .glass-panel { background: var(--glass); border: 1px solid rgba(255,255,255,0.12); border-radius: 30px; padding: 45px; backdrop-filter: blur(25px); box-shadow: 0 25px 55px rgba(0,0,0,0.6); }
        
        input, textarea { width: 100%; padding: 15px; margin: 12px 0; background: rgba(0,0,0,0.7); border: 1px solid #333; color: white !important; border-radius: 12px; font-family: 'Poppins'; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: var(--gold); box-shadow: 0 0 15px var(--gold); outline: none; background: #000; }
        .action-btn { background: var(--gold); color: black; border: none; padding: 18px; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 20px; transition: 0.4s; letter-spacing: 2px; }
        .action-btn:hover { background: white; transform: scale(1.03); box-shadow: 0 0 25px var(--gold); }

        /* STRICT 2-PAGE PDF TEMPLATE */
        #render-vault { position: absolute; left: -9999px; top: -9999px; }
        .pdf-page { background: white; color: #333; width: 210mm; height: 296.5mm; padding: 20mm; box-sizing: border-box; overflow: hidden; position: relative; display: block; }
        .p-header { border-bottom: 8px solid var(--gold); padding-bottom: 30px; display: flex; align-items: center; gap: 40px; margin-bottom: 20px; }
        .p-img-circle { width: 180px; height: 180px; border-radius: 50%; border: 6px solid var(--gold); object-fit: cover; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        h2 { border-left: 10px solid var(--gold); padding-left: 20px; text-transform: uppercase; font-size: 26px; margin-top: 40px; color: #000; letter-spacing: 2px; }
        .p-text { font-size: 16px; line-height: 1.8; white-space: pre-line; color: #444; text-align: justify; }
        .page-marker { position: absolute; bottom: 15mm; right: 20mm; color: #ddd; font-weight: 900; font-size: 20px; }
    </style>
</head>
<body id="master-body">

    <div class="menu-trigger" onclick="toggleSidebar()">
        <div style="width:30px; height:3px; background:var(--gold); margin:6px 0;"></div>
        <div style="width:30px; height:3px; background:var(--gold); margin:6px 0;"></div>
        <div style="width:30px; height:3px; background:var(--gold); margin:6px 0;"></div>
    </div>

    <div class="sidebar" id="sidebar-nav">
        <h2 style="color:var(--gold); font-family:'Orbitron';">SELECT VIBE</h2>
        <button class="action-btn" onclick="setMode('Classic')">Gold Elite</button>
        <button class="action-btn" onclick="setMode('Modern')" style="background:#fff; margin-top:15px;">Modern Minimal</button>
        <button class="action-btn" onclick="setMode('Cyber')" style="background:#00ff00; margin-top:15px;">Cyber Matrix</button>
    </div>

    <div class="door left-door"></div>
    <div class="door right-door"></div>

    <div class="auth-overlay">
        <div class="auth-card">
            <h1 style="color:var(--gold); font-family:'Orbitron'; font-size:26px; margin-bottom:20px; letter-spacing:3px;">SYSTEM ACCESS</h1>
            <input type="text" id="login-user" placeholder="ENTER YOUR NAME">
            <div id="captcha-box" style="background:#000; color:var(--gold); padding:15px; margin:15px 0; letter-spacing:12px; font-weight:900; border:1px dashed var(--gold); font-size:26px;"></div>
            <input type="text" id="captcha-input" placeholder="TYPE CAPTCHA">
            <button class="action-btn" onclick="verifyLogin()">INITIALIZE NEXUS ⚡</button>
        </div>
    </div>

    <div id="welcome-layer">
        <h1 class="greet-3d" id="greet-msg"></h1>
    </div>

    <div class="main-container">
        <div class="glass-panel">
            <h2 id="current-type" style="color:var(--gold); margin:0; font-family:'Orbitron'; border:none; padding:0;">MODE: CLASSIC (2-PAGE)</h2>
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:20px; margin-top:35px;">
                <input type="text" id="fn" placeholder="Full Name">
                <input type="text" id="fr" placeholder="Current Role (e.g. AI Developer)">
                <input type="text" id="fph" placeholder="Phone Number">
                <input type="email" id="fem" placeholder="Email Address">
                <input type="text" id="fli" placeholder="LinkedIn Profile URL">
                <input type="file" id="fimg" onchange="processImage(event)">
            </div>
            <textarea id="f-about" rows="4" placeholder="Professional Summary (Page 1)"></textarea>
            <textarea id="f-projects" rows="6" placeholder="Main Projects (Page 1)"></textarea>
            <textarea id="f-extra" rows="5" placeholder="Certifications, Achievements & Skills (Page 2 Content)"></textarea>
            <button class="action-btn" onclick="generateAndReady()">GENERATE 2-PAGE MASTERPIECE ✨</button>
        </div>
        
        <div id="preview-status" style="display:none; text-align:center; margin-top:40px;">
            <p style="color:var(--gold); font-weight:bold; letter-spacing:2px;">STABLE 2-PAGE PREVIEW READY</p>
            <button class="action-btn" onclick="finalDownload()" style="background:#2ecc71; max-width:350px;">SAVE SECURE PDF 📄</button>
        </div>
    </div>

    <div id="render-vault">
        <div id="pdf-to-capture">
            <div class="pdf-page" id="p1">
                <div class="p-header">
                    <img id="res-img" class="p-img-circle" src="">
                    <div>
                        <h1 id="res-name" style="margin:0; font-size:45px; text-transform:uppercase; font-weight:800;"></h1>
                        <p id="res-role" style="color:var(--gold); font-weight:800; font-size:24px; margin-top:5px;"></p>
                        <p id="res-contacts" style="font-size:15px; color:#666; margin-top:10px;"></p>
                    </div>
                </div>
                <h2>About Me</h2>
                <p id="res-about" class="p-text"></p>
                <h2>Featured Projects</h2>
                <p id="res-projects" class="p-text"></p>
                <div class="page-marker">01</div>
            </div>
            <div class="pdf-page" id="p2" style="margin-top:5mm;">
                <h2>Certifications & Achievements</h2>
                <p id="res-extra" class="p-text"></p>
                <div style="margin-top:50px;">
                    <h2>Technical Expertise</h2>
                    <p class="p-text" style="font-weight:bold;">Languages: Python, Java, C++, JavaScript<br>Web: React, Node.js, HTML5, CSS3<br>Tools: Git, VS Code, Postman</p>
                </div>
                <div class="page-marker">02</div>
            </div>
        </div>
    </div>

    <script>
        let capCode = Math.random().toString(36).substring(2, 7).toUpperCase();
        document.getElementById('captcha-box').innerText = capCode;
        let currentMode = 'Classic';

        function toggleSidebar() { document.getElementById('sidebar-nav').classList.toggle('active'); }
        function setMode(m) { currentMode = m; document.getElementById('current-type').innerText = "TYPE: " + m.toUpperCase(); toggleSidebar(); }

        function verifyLogin() {
            const user = document.getElementById('login-user').value;
            const input = document.getElementById('captcha-input').value.toUpperCase();
            if(user && input === capCode) {
                document.getElementById('master-body').classList.add('open');
                const welcome = document.getElementById('welcome-layer');
                const msg = document.getElementById('greet-msg');
                welcome.style.display = 'flex';
                msg.innerText = "ACCESS GRANTED: " + user.toUpperCase();
                setTimeout(() => { msg.style.opacity = 1; msg.style.transform = "translateZ(0px)"; }, 100);
                setTimeout(() => { welcome.style.opacity = 0; setTimeout(() => welcome.style.display='none', 800); }, 3000);
            } else { alert("ACCESS DENIED: Captcha Incorrect"); }
        }

        let imageData = "";
        function processImage(e) {
            const reader = new FileReader();
            reader.onload = () => imageData = reader.result;
            reader.readAsDataURL(e.target.files[0]);
        }

        function generateAndReady() {
            document.getElementById('res-name').innerText = document.getElementById('fn').value;
            document.getElementById('res-role').innerText = document.getElementById('fr').value;
            document.getElementById('res-contacts').innerText = `📞 ${document.getElementById('fph').value} | 📧 ${document.getElementById('fem').value} | 🔗 LinkedIn Profile`;
            document.getElementById('res-about').innerText = document.getElementById('f-about').value;
            document.getElementById('res-projects').innerText = document.getElementById('f-projects').value;
            document.getElementById('res-extra').innerText = document.getElementById('f-extra').value;
            if(imageData) document.getElementById('res-img').src = imageData;
            
            document.getElementById('preview-status').style.display = 'block';
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function finalDownload() {
            const element = document.getElementById('pdf-to-capture');
            const opt = {
                margin: 0,
                filename: 'Aleti_Pranav_Portfolio.pdf',
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { scale: 3, useCORS: true, letterRendering: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
